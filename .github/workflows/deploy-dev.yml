name: Deploy to DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      # 占位：你的构建/打包步骤（产物放哪、叫什么，由你决定）
      # - name: Build
      #   run: ./scripts/build.sh

      - name: Resolve DEV IP by tag
        id: host
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:env,Values=dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ steps.host.outputs.ip }} >> ~/.ssh/known_hosts

      # 占位：上传产物（如有）到服务器
      # - name: Upload artifact
      #   run: scp -i ~/.ssh/id_ed25519 ./artifact.tar.gz deploy@${{ steps.host.outputs.ip }}:/tmp/

      - name: Release on server
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ steps.host.outputs.ip }} \
            "VERSION='dev-${GITHUB_SHA::7}-$(date +%Y%m%d%H%M%S)' bash -s" <<'EOF'
          set -euo pipefail
          echo "Deploying $VERSION on $(hostname)"
          # 占位：解包 / 安装 / 切软链 / 重启 / 健康检查
          # 例如：
          #   sudo ln -sfn /opt/app/releases/$VERSION /opt/app/current
          #   sudo sed -i "s/^APP_VERSION=.*/APP_VERSION=$VERSION/" /opt/app/shared/.env
          #   sudo systemctl restart app.service
          #   curl -fsS http://localhost:8080/health
          echo "done"
          EOF